<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TripJack</title>
<style>
  :root {
    color-scheme: light;
    --orange: #F26B21;
    --orange-dark: #D9591A;
    --charcoal: #4A4A4A;
    --text: #2B2B2B;
    --text-2: #6B6B6B;
    --text-mute: #9A9A9A;
    --bg: #FFFFFF;
    --surface-2: #F7F6F4;
    --border: #E9E7E3;
    --success: #178A43;
    --success-bg: #EAF6EE;
    --danger: #C23A2E;
    --danger-bg: #FBECEA;
    --warn: #B4790A;
    --warn-bg: #FBF1DE;
  }
  * { box-sizing: border-box; }
  body {
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 360px; margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
  }
  .mark {
    width: 8px; height: 20px; border-radius: 3px;
    background: linear-gradient(180deg, var(--orange), var(--orange-dark));
    flex: 0 0 auto;
  }
  h1 { font-size: 14.5px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .tag { font-size: 10.5px; color: var(--text-mute); margin-top: 1px; }
  main { padding: 14px 16px 16px; }

  button#go {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: var(--orange); color: #fff; cursor: pointer;
    font-size: 13.5px; font-weight: 700; letter-spacing: 0.01em;
    box-shadow: 0 1px 2px rgba(210, 90, 30, 0.25);
    transition: background 0.12s ease;
  }
  button#go:hover { background: var(--orange-dark); }
  button#go:disabled { background: #E2DFDB; color: #A7A39D; box-shadow: none; cursor: default; }

  #status {
    margin-top: 9px; color: var(--text-2); font-size: 11.5px;
    line-height: 1.4; min-height: 15px;
  }

  #out { margin-top: 10px; }
  .card {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 2px 12px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .row:last-child { border-bottom: none; }
  .k {
    color: var(--text-mute); flex: 0 0 auto; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
  }
  .v { text-align: right; word-break: break-word; font-weight: 500; }
  .price { font-size: 14px; font-weight: 700; color: var(--text); }

  .band {
    display: inline-block; padding: 1.5px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .band-high { background: var(--success-bg); color: var(--success); }
  .band-medium { background: var(--warn-bg); color: var(--warn); }
  .band-none { background: var(--danger-bg); color: var(--danger); }

  .savings-up   { color: var(--success); font-weight: 700; }
  .savings-down { color: var(--danger); font-weight: 700; }
  .muted { color: var(--text-mute); }

  #adminLink { display: none; }

  details { margin-top: 8px; }
  details summary {
    cursor: pointer; color: var(--text-mute); font-size: 11px;
    padding: 3px 0; outline: none;
  }
  details summary:hover { color: var(--text-2); }
  .steps {
    max-height: 150px; overflow-y: auto; margin-top: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--surface-2); border-radius: 8px; padding: 6px 8px;
  }
  .step {
    display: flex; gap: 8px; font-size: 10.5px; color: var(--text-2);
    padding: 2.5px 0; border-bottom: 1px solid var(--border);
  }
  .step:last-child { border-bottom: none; }
  .step .t { color: var(--orange-dark); flex: 0 0 auto; min-width: 38px; font-weight: 600; }

  #bookBtn {
    display: none; width: 100%; margin-top: 10px; padding: 10px; border: none;
    border-radius: 8px; background: var(--success); color: #fff;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  #bookBtn:hover { background: #136e35; }
  #bookPanel {
    display: none; margin-top: 10px; padding: 11px 12px; border-radius: 10px;
    background: var(--success-bg); border: 1px solid #CDEBD8;
  }
  #bookSummary {
    white-space: pre-wrap; font-size: 11.5px; color: #205C34; line-height: 1.55;
    margin-bottom: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #waLink {
    display: block; text-align: center; padding: 9px; border-radius: 7px;
    background: #25D366; color: #06331A; font-weight: 700; font-size: 12.5px;
    text-decoration: none;
  }
  #waLink:hover { background: #1fb057; }

  .note { margin-top: 8px; font-size: 11px; color: var(--text-mute); }
  .note.err { color: var(--danger); }
</style>
</head>
<body>
  <header>
    <div class="mark"></div>
    <div>
      <h1>TripJack</h1>
      <div class="tag">OTA price checker</div>
    </div>
  </header>
  <main>
    <button id="go">Fetch TripJack Price</button>
    <div id="status">Open an OTA hotel page, then click above.</div>
    <div id="out"></div>
    <button id="bookBtn">📩 Book this rate with me</button>
    <div id="bookPanel">
      <div id="bookSummary"></div>
      <a id="waLink" target="_blank">Send on WhatsApp →</a>
    </div>
    <a id="panelLink" target="_blank" style="display:none"></a>
    <a id="adminLink" href="#">⚙ Markup settings →</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
